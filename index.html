<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#b8860b">
<title>QUINIELAS ROMA — JORNADA 14</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;width:100%}
body{font-family:Arial,sans-serif;background:#000;color:#fff;padding:14px;max-width:540px;margin:0 auto}
.main-title{text-align:center;font-size:22px;margin-bottom:16px;color:#ffd300;font-weight:bold}
.header-name{
  width:100%;
  padding:14px;
  border:3px solid #ffd300;
  background:#000 !important;
  color:#ffffff !important;
  -webkit-text-fill-color:#ffffff !important;
  caret-color:#ffffff !important;
  font-size:17px;
  border-radius:22px;
  margin-bottom:22px;
}
.header-name::placeholder{color:transparent !important}
.match{display:grid;grid-template-columns:60px 1fr 54px 4px 54px 1fr 60px;gap:6px;align-items:center;border:2px solid #444;border-radius:14px;padding:12px 6px;margin-bottom:12px;background:#111}
.emoji-team{text-align:center;font-size:26px}
.team-label{text-align:center;font-size:14px;margin-top:4px}
.score{width:52px;height:52px;font-size:22px;border:none;background:#fff;color:#000;border-radius:10px;text-align:center;font-weight:bold}
.divider{background:#ffd300;height:4px}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:24px}
.btn{padding:13px;border:none;border-radius:12px;font-weight:bold;font-size:15px}
.btn-card{background:#7b2cbf;color:#fff}
.send{background:#22aa55;color:#fff}
.clear{background:#aa2222;color:#fff}
.pago-notice{margin-top:22px;text-align:center;font-size:16px;color:#ffd300;font-weight:bold}
.foot{text-align:center;color:#888;margin-top:12px;font-size:13px}
@media(max-width:420px){
  .match{grid-template-columns:54px 1fr 48px 3px 48px 1fr 54px;padding:10px 4px}
  .emoji-team{font-size:24px}
  .score{width:46px;height:46px;font-size:19px}
}
</style>
</head>
<body>
<div class="main-title">🥅 Quinielas ⚽ RoMa 🥅 $30 pesos</div>
<input id="nombre" class="header-name" type="text" placeholder="">
<div id="matches"></div>
<section class="actions">
  <button class="btn btn-card" onclick="mostrarTarjeta()">Ver número de tarjeta</button>
  <button class="btn send" onclick="enviarWhats()">Enviar WhatsApp</button>
  <button class="btn clear" onclick="limpiar()">Borrar todo</button>
</section>
<div class="pago-notice">💳 PAGO — SPIN BY OXXO</div>
<div class="foot">Quinielas Roma Jornada 14</div>

<script>
const NUM_TARJETA = "4217 4702 7509 9253";
const teamsEmoji = {
  "Puebla":"🍠",
  "León":"🦁",
  "Tigres":"🐯",
  "Toluca":"😈",
  "Querétaro":"🐓",
  "Atlante":"🐎",
  "Juárez":"🐕",
  "Tijuana":"🐺",
  "Atlas":"🦊",
  "Chivas":"🐐",
  "América":"🦅",
  "Rayados":"🤠",
  "San Luis":"🌵",
  "Santos":"👼",
  "Pachuca":"🐹",
  "Necaxa":"⚡",
  "Pumas":"🐱",
  "Cruz Azul":"🐇"
};

// 9 partidos de la Jornada 14
const games = [
  ["Juárez","Necaxa"],
  ["Atlante","San Luis"],
  ["León","Toluca"],
  ["Rayados","Chivas"],
  ["Pumas","Tigres"],
  ["Atlas","Puebla"],
  ["Querétaro","Cruz Azul"],
  ["América","Pachuca"],
  ["Tijuana","Santos"]
];

let html="";
games.forEach((g,i)=>{
  const eL=teamsEmoji[g[0]], eV=teamsEmoji[g[1]];
  html+=`<div class="match">
    <div><div class="emoji-team">${eL}</div><div class="team-label">${g[0]}</div></div>
    <div></div>
    <input class="score" id="l${i}" type="number" min="0" value="">
    <div class="divider"></div>
    <input class="score" id="v${i}" type="number" min="0" value="">
    <div></div>
    <div><div class="emoji-team">${eV}</div><div class="team-label">${g[1]}</div></div>
  </div>`;
});
document.getElementById("matches").innerHTML=html;

function mostrarTarjeta(){
  navigator.clipboard.writeText(NUM_TARJETA).then(()=>alert("Número copiado:\n"+NUM_TARJETA));
}

function armarTexto(){
  const nom=document.getElementById("nombre").value||"";
  let mensaje = nom + "\n";
  games.forEach((g,i)=>{
    const lg=document.getElementById(`l${i}`).value||"?";
    const vg=document.getElementById(`v${i}`).value||"?";
    mensaje += `${g[0]} ${lg}‑${vg} ${g[1]}\n`;
  });
  return mensaje;
}
function enviarWhats(){
  const num="529342771745";
  const t=encodeURIComponent(armarTexto());
  window.open(`https://wa.me/${num}?text=${t}`);
}
function limpiar(){
  document.getElementById("nombre").value="";
  games.forEach((g,i)=>{
    document.getElementById(`l${i}`).value="";
    document.getElementById(`v${i}`).value="";
  });
}
</script>
</body>
                                             </html>
