<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QUINIELAS ROMA — JORNADA 10</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html{width:100%;}
body{
    font-family:Arial,sans-serif;
    background:#f0f2f5;
    padding:4px;
    width:100%;
}
.contenedor{max-width:400px;width:100%;margin:0 auto;}

.cabecera{
    background:#000;
    color:#fff;
    padding:8px;
    text-align:center;
    border-radius:8px;
    margin-bottom:8px;
}
.cabecera h1{font-size:17px;}

.nombre-linea{
    width:100%;
    border:none;
    border-bottom:2px solid #000;
    font-size:16px;
    padding:6px 0;
    margin-bottom:8px;
    text-align:center;
    outline:none;
}

.fecha{
    background:#ddd;
    padding:4px 8px;
    margin:8px 0 4px;
    font-weight:bold;
    font-size:13px;
    border-radius:4px;
}

.partido{
    background:#fff;
    padding:8px 6px;
    margin-bottom:4px;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
}

.escudo{
    width:32px;
    height:32px;
    object-fit:contain;
    flex-shrink:0;
}

.eq-der{justify-content:flex-start;}
.eq-izq{justify-content:flex-end;}

.nombre-eq{
    font-weight:bold;
    font-size:13px;
    white-space:nowrap;
}

.caja-gol{
    width:40px;
    height:40px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    border:2px solid #000;
    border-radius:4px;
    margin:0 4px;
}

.botones{display:flex;gap:8px;margin-top:10px;}
.boton-borrar{
    flex:1;
    padding:10px;
    background:#FFC107;
    color:#000;
    font-size:15px;
    font-weight:bold;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
.boton-enviar{
    flex:2;
    padding:10px;
    background:#25D366;
    color:#fff;
    font-size:15px;
    font-weight:bold;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
</style>
</head>
<body>
<div class="contenedor">

<div class="cabecera"><h1>QUINIELAS ROMA — JORNADA 10</h1></div>
<input type="text" class="nombre-linea" placeholder="NOMBRE">

<div class="fecha">VIERNES 25 DE SEPTIEMBRE</div>

<div class="partido">
<img src="atlante.png" class="escudo">
<span class="nombre-eq">ATLANTE</span>
<input type="number" class="caja-gol" id="atlante" min="0">
<span>-</span>
<input type="number" class="caja-gol" id="monterrey" min="0">
<span class="nombre-eq">RAYADOS</span>
<img src="monterrey.png" class="escudo">
</div>

<div class="partido">
<img src="tijuana.png" class="escudo">
<span class="nombre-eq">TIJUANA</span>
<input type="number" class="caja-gol" id="tijuana" min="0">
<span>-</span>
<input type="number" class="caja-gol" id="atlas" min="0">
<span class="nombre-eq">ATLAS</span>
<img src="atlas.png" class="escudo">
</div>

<div class="fecha">SÁBADO 26 DE SEPTIEMBRE</div>

<div class="partido">
<img src="cruzazul.png" class="escudo">
<span class="nombre-eq">CRUZ AZUL</span>
<input type="number" class="caja-gol" id="cruzazul" min="0">
<span>-</span>
<input type="number" class="caja-gol" id="toluca" min="0">
<span class="nombre-eq">TOLUCA</span>
<img src="toluca.png" class="escudo">
</div>

<div class="partido">
<img src="chivas.png" class="escudo">
<span class="nombre-eq">CHIVAS</span>
<input type="number" class="caja-gol" id="chivas" min="0">
<span>-</span>
<input type="number" class="caja-gol" id="queretaro" min="0">
<span class="nombre-eq">QUERÉTARO</span>
<img src="queretaro.png" class="escudo">
</div>

<div class="partido">
<img src="santos.png" class="escudo">
<span class="nombre-eq">SANTOS</span>
<input type="number" class="caja-gol" id="santos" min="0">
<span>-</span>
<input type="number" class="caja-gol" id="pachuca" min="0">
<span class="nombre-eq">PACHUCA</span>
<img src="pachuca.png" class="escudo">
</div>

<div class="partido">
<img src="tigres.png" class="escudo">
<span class="nombre-eq">TIGRES</span>
<input type="number" class="caja-gol" id="tigres" min="0">
<span>-</span>
<input type="number" class="caja-gol" id="puebla" min="0">
<span class="nombre-eq">PUEBLA</span>
<img src="puebla.png" class="escudo">
</div>

<div class="fecha">DOMINGO 27 DE SEPTIEMBRE</div>

<div class="partido">
<img src="pumas.png" class="escudo">
<span class="nombre-eq">PUMAS</span>
<input type="number" class="caja-gol" id="pumas" min="0">
<span>-</span>
<input type="number" class="caja-gol" id="sanluis" min="0">
<span class="nombre-eq">SAN LUIS</span>
<img src="sanluis.png" class="escudo">
</div>

<div class="partido">
<img src="leon.png" class="escudo">
<span class="nombre-eq">LEÓN</span>
<input type="number" class="caja-gol" id="leon" min="0">
<span>-</span>
<input type="number" class="caja-gol" id="juarez" min="0">
<span class="nombre-eq">JUÁREZ</span>
<img src="juarez.png" class="escudo">
</div>

<div class="partido">
<img src="necaxa.png" class="escudo">
<span class="nombre-eq">NECAXA</span>
<input type="number" class="caja-gol" id="necaxa" min="0">
<span>-</span>
<input type="number" class="caja-gol" id="america" min="0">
<span class="nombre-eq">AMÉRICA</span>
<img src="america.png" class="escudo">
</div>

<div class="botones">
<button class="boton-borrar" onclick="borrarTodo()">🟡 Borrar</button>
<button class="boton-enviar" onclick="enviarTodo()">📲 Enviar a WhatsApp</button>
</div>

</div>

<script>
const NUMERO1 = "529342771745";
const NUMERO2 = "526678248973";

function valor(id){return document.getElementById(id).value||"-";}

function enviarTodo(){
const n=document.querySelector(".nombre-linea").value.toUpperCase()||"SIN NOMBRE";

let texto=`NOMBRE: ${n}\n\n`;
texto+=`ATLANTE     ${valor("atlante")} - ${valor("monterrey")}     RAYADOS\n`;
texto+=`TIJUANA     ${valor("tijuana")} - ${valor("atlas")}     ATLAS\n`;
texto+=`CRUZ AZUL   ${valor("cruzazul")} - ${valor("toluca")}     TOLUCA\n`;
texto+=`CHIVAS      ${valor("chivas")} - ${valor("queretaro")}     QUERÉTARO\n`;
texto+=`SANTOS      ${valor("santos")} - ${valor("pachuca")}     PACHUCA\n`;
texto+=`TIGRES      ${valor("tigres")} - ${valor("puebla")}     PUEBLA\n`;
texto+=`PUMAS       ${valor("pumas")} - ${valor("sanluis")}     SAN LUIS\n`;
texto+=`LEÓN        ${valor("leon")} - ${valor("juarez")}     JUÁREZ\n`;
texto+=`NECAXA      ${valor("necaxa")} - ${valor("america")}     AMÉRICA\n`;

window.open(`https://wa.me/${NUMERO1}?text=${encodeURIComponent(texto)}`, "_blank");
setTimeout(()=>{
window.open(`https://wa.me/${NUMERO2}?text=${encodeURIComponent(texto)}`, "_blank");
}, 800);
}

function borrarTodo(){
document.querySelector(".nombre-linea").value="";
document.querySelectorAll(".caja-gol").forEach(i=>i.value="");
}
</script>
</body>
</html>
