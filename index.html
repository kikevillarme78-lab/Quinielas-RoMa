<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUINIELAS ROMA — JORNADA 10</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html{width:100%;}
body{font-family:Arial,sans-serif;background:#f0f2f5;padding:6px;width:100%;}
.contenedor{max-width:420px;width:100%;margin:0 auto;}
.cabecera{background:#000;color:#fff;padding:12px;text-align:center;border-radius:10px;margin-bottom:15px;}
.cabecera h1{font-size:20px;}
.linea-nombre{border:none;border-bottom:2px solid #000;font-size:18px;width:100%;padding:8px 0;outline:none;margin-bottom:15px;}
.grupo-fecha{background:#e0e0e0;padding:6px 10px;border-radius:6px;margin:10px 0 5px;font-weight:bold;font-size:14px;}
.partido{background:#fff;padding:12px;margin-bottom:8px;border-radius:8px;display:flex;align-items:center;justify-content:space-between;}
.equipo{display:flex;align-items:center;gap:10px;font-weight:bold;font-size:15px;}
.escudo{width:45px;height:45px;object-fit:contain;}
.marcador{display:flex;align-items:center;gap:10px;}
.marcador input{width:50px;height:50px;text-align:center;font-size:20px;font-weight:bold;border:2px solid #000;border-radius:6px;}
.boton-borrar{width:100%;padding:12px;background:#FFC107;color:#000;font-size:17px;font-weight:bold;border:none;border-radius:10px;cursor:pointer;margin-top:10px;}
.boton-enviar{width:100%;padding:14px;background:#25D366;color:#fff;font-size:18px;font-weight:bold;border:none;border-radius:10px;cursor:pointer;margin-top:10px;}
.boton-enviar:hover{background:#128C7E;}
</style>
</head>
<body>
<div class="contenedor">
<div class="cabecera">
<h1>QUINIELAS ROMA — JORNADA 10</h1>
</div>

<input type="text" id="nombre" class="linea-nombre" placeholder="">

<div class="grupo-fecha">VIERNES 25 DE SEPTIEMBRE</div>

<div class="partido">
<div class="equipo"><img src="atlante.png" class="escudo" alt="Atlante"> ATLANTE</div>
<div class="marcador"><input type="number" id="atlante" min="0"> - <input type="number" id="monterrey" min="0"></div>
<div class="equipo">RAYADOS <img src="monterrey.png" class="escudo" alt="Rayados"></div>
</div>

<div class="partido">
<div class="equipo"><img src="tijuana.png" class="escudo" alt="Tijuana"> TIJUANA</div>
<div class="marcador"><input type="number" id="tijuana" min="0"> - <input type="number" id="atlas" min="0"></div>
<div class="equipo">ATLAS <img src="atlas.png" class="escudo" alt="Atlas"></div>
</div>

<div class="grupo-fecha">SÁBADO 26 DE SEPTIEMBRE</div>

<div class="partido">
<div class="equipo"><img src="cruzazul.png" class="escudo" alt="Cruz Azul"> CRUZ AZUL</div>
<div class="marcador"><input type="number" id="cruzazul" min="0"> - <input type="number" id="toluca" min="0"></div>
<div class="equipo">TOLUCA <img src="toluca.png" class="escudo" alt="Toluca"></div>
</div>

<div class="partido">
<div class="equipo"><img src="chivas.png" class="escudo" alt="Chivas"> CHIVAS</div>
<div class="marcador"><input type="number" id="chivas" min="0"> - <input type="number" id="queretaro" min="0"></div>
<div class="equipo">QUERÉTARO <img src="queretaro.png" class="escudo" alt="Querétaro"></div>
</div>

<div class="partido">
<div class="equipo"><img src="santos.png" class="escudo" alt="Santos"> SANTOS</div>
<div class="marcador"><input type="number" id="santos" min="0"> - <input type="number" id="pachuca" min="0"></div>
<div class="equipo">PACHUCA <img src="pachuca.png" class="escudo" alt="Pachuca"></div>
</div>

<div class="partido">
<div class="equipo"><img src="tigres.png" class="escudo" alt="Tigres"> TIGRES</div>
<div class="marcador"><input type="number" id="tigres" min="0"> - <input type="number" id="puebla" min="0"></div>
<div class="equipo">PUEBLA <img src="puebla.png" class="escudo" alt="Puebla"></div>
</div>

<div class="grupo-fecha">DOMINGO 27 DE SEPTIEMBRE</div>

<div class="partido">
<div class="equipo"><img src="pumas.png" class="escudo" alt="Pumas"> PUMAS</div>
<div class="marcador"><input type="number" id="pumas" min="0"> - <input type="number" id="sanluis" min="0"></div>
<div class="equipo">SAN LUIS <img src="sanluis.png" class="escudo" alt="San Luis"></div>
</div>

<div class="partido">
<div class="equipo"><img src="leon.png" class="escudo" alt="León"> LEÓN</div>
<div class="marcador"><input type="number" id="leon" min="0"> - <input type="number" id="juarez" min="0"></div>
<div class="equipo">JUÁREZ <img src="juarez.png" class="escudo" alt="Juárez"></div>
</div>

<div class="partido">
<div class="equipo"><img src="necaxa.png" class="escudo" alt="Necaxa"> NECAXA</div>
<div class="marcador"><input type="number" id="necaxa" min="0"> - <input type="number" id="america" min="0"></div>
<div class="equipo">AMÉRICA <img src="america.png" class="escudo" alt="América"></div>
</div>

<button class="boton-borrar" onclick="borrarTodo()">🟡 Borrar todo</button>
<button class="boton-enviar" onclick="enviarWhatsApp()">📲 Enviar a WhatsApp</button>
</div>

<script>
const NUMERO1 = "529342771745";
const NUMERO2 = "526678248973";

function valor(id){return document.getElementById(id).value||"?";}

function enviarWhatsApp(){
const n=document.getElementById("nombre").value.toUpperCase()||"SIN NOMBRE";
let texto=`NOMBRE: ${n}\n\n`;
texto+=`ATLANTE     ${valor("atlante")} - ${valor("monterrey")}     RAYADOS\n`;
texto+=`TIJUANA     ${valor("tijuana")} - ${valor("atlas")}     ATLAS\n`;
texto+=`CRUZ AZUL   ${valor("cruzazul")} - ${valor("toluca")}     TOLUCA\n`;
texto+=`CHIVAS      ${valor("chivas")} - ${valor("queretaro")}     QUERÉTARO\n`;
texto+=`SANTOS      ${valor("santos")} - ${valor("pachuca")}     PACHUCA\n`;
texto+=`TIGRES      ${valor("tigres")} - ${valor("puebla")}     PUEBLA\n`;
texto+=`PUMAS       ${valor("pumas")} - ${valor("sanluis")}     SAN LUIS\n`;
texto+=`LEÓN        ${valor("leon")} - ${valor("juarez")}     JUÁREZ\n`;
texto+=`NECAXA      ${valor("necaxa")} - ${valor("america")}     AMÉRICA\n`;

window.open(`https://wa.me/${NUMERO1}?text=${encodeURIComponent(texto)}`, "_blank");
setTimeout(()=>{
window.open(`https://wa.me/${NUMERO2}?text=${encodeURIComponent(texto)}`, "_blank");
}, 800);
}

function borrarTodo(){
document.getElementById("nombre").value="";
document.querySelectorAll("input[type=number]").forEach(i=>i.value="");
}
</script>
</body>
                                                                    </html>
